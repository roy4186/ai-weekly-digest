name: 動画を集めて要点メモを作る

on:
  schedule:
    - cron: "17 20 * * *"   # 毎日 05:17（日本時間）
  workflow_dispatch:         # 手動実行ボタン
  push:
    branches: [main]
    paths:
      - config.yml           # 設定を書き換えたらすぐ1回動く

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # 常に最新の状態から始める（処理済みの記録を取りこぼさない）

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 準備
        run: pip install pyyaml

      - name: 収集と要約
        id: collect
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/collect.py

      - name: 結果を保存
        if: always()
        run: |
          git config user.name "ai-weekly-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes data logs
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "collect: $(TZ=Asia/Tokyo date +%F)"
          for i in 1 2 3; do
            # 実行中に設定などが更新されていても、今回の収集結果を優先して取り込む
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
