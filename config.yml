# ============================================================
# AIウィークリー 収集設定
# ここを書き換えて保存（コミット）すると、すぐに収集が1回動きます。
# ============================================================

# --- 必ずチェックするチャンネル ---------------------------------
# name: 表示名（自由） / handle: @から始まるハンドル
# channel_id: 分かれば書く（書いておくと確実。空でもOK）
# company: anthropic / openai / google / other
channels:
  - name: Anthropic
    handle: "@anthropic-ai"
    channel_id: UCrDwWp7EBBv4NwvScIpBDOA
    company: anthropic
  - name: OpenAI
    handle: "@OpenAI"
    channel_id: UCXZCJLdBC09xxGZ6gcdrc6A
    company: openai
  - name: Google DeepMind
    handle: "@googledeepmind"
    channel_id: UCP7jMXSY2xbc3KCAE0MHQ-A
    company: google
  - name: Google for Developers
    handle: "@GoogleDevelopers"
    channel_id: UC_x5XG1OV2P6uZZ5FSM9Ttw
    company: google
    # AI以外（Android等）の動画も多いので、タイトルにこの言葉を含むものだけ拾う
    include_keywords: [Gemini, AI, Gemma, Agent, Veo, Imagen, NotebookLM, Jules]
  # 追加したいチャンネルはこの下に同じ形で足す
  # （include_keywords は任意。書くとタイトルで絞り込む）
  # - name: 〇〇チャンネル
  #   handle: "@xxxx"
  #   channel_id: ""
  #   company: other

# --- 発掘枠：キーワード検索 ---------------------------------------
# 直近の動画を再生数の多い順に探し、上位を要約します。
# lang: ja / en（その言語の動画を優先して探す）
discovery:
  enabled: true
  queries:
    - { q: "Claude 新機能", lang: ja }
    - { q: "ChatGPT 新機能", lang: ja }
    - { q: "Gemini 新機能", lang: ja }
    - { q: "Anthropic Claude", lang: en }
    - { q: "OpenAI ChatGPT", lang: en }
    - { q: "Google Gemini", lang: en }
  min_views: 5000          # これより再生数が少ない動画は除外
  per_run: 2               # 1回の実行で要約する発掘動画の最大本数
  exclude_channels: []     # 除外したいチャンネルのID（UC...）

# --- 動画の条件 ----------------------------------------------------
filters:
  lookback_days: 8         # 何日前までの動画を対象にするか
  min_duration_sec: 180    # 3分未満（ショート動画など）は除外
  max_duration_min: 240    # 4時間を超える動画は除外

# --- Gemini（動画を見る係）の設定 ---------------------------------
gemini:
  # 上から順に試し、使えなければ次のモデルへ切り替えます
  models:
    - gemini-3.8-flash
    - gemini-3.6-flash
    - gemini-3.5-flash-lite
  max_videos_per_run: 8    # 1回の実行で要約する最大本数（全体）
  daily_minutes_budget: 420  # 1日に処理する動画の合計分数（無料枠は1日8時間）
  long_video_min: 90       # これより長い動画はフレームを間引いて処理
  max_attempts: 3          # 失敗がこの回数に達したら諦めて記録だけ残す
  language: 日本語
